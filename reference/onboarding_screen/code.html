<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Top Navigation Bar (Simplified for Onboarding) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full sticky top-0 bg-surface/80 backdrop-blur-md z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="directions_run">directions_run</span>
<h1 class="font-display-lg text-headline-sm text-primary">Gait Analysis</h1>
</div>
<button class="font-label-md text-primary hover:opacity-80 transition-all active:scale-95">
            Skip
        </button>
</header>
<!-- Main Content: Onboarding Carousel Container -->
<main class="flex-1 flex flex-col relative">
<!-- Slide Content (Currently showing Slide 1 as primary example) -->
<section class="flex-1 flex flex-col px-margin-mobile py-xl">
<!-- Illustration Area: Bento-inspired layout for visual balance -->
<div class="w-full aspect-[4/5] max-h-[400px] mb-xl relative overflow-hidden rounded-xl bg-surface-container-lowest shadow-[0_4px_20px_0_rgba(29,53,87,0.06)]">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/20 to-transparent"></div>
<!-- Main Illustration Placeholder -->
<div class="absolute inset-0 flex items-center justify-center p-xl">

</div>
<!-- Floating Data Chips for visual depth -->
<div class="absolute top-md right-md bg-white/90 backdrop-blur-sm px-sm py-xs rounded-full border border-primary-container/30 flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-primary text-[16px]" data-icon="check_circle" data-weight="fill">check_circle</span>
<span class="font-label-sm text-on-surface-variant">Live Sensors</span>
</div>
</div>
<!-- Typography Content -->
<div class="flex flex-col gap-md text-center">
<h2 class="font-display-lg text-display-lg text-on-surface leading-tight">
                    Analyze Your Walking Pattern
                </h2>
<p class="font-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                    Use your smartphone sensors to understand your gait quality.
                </p>
</div>
</section>
<!-- Footer Actions Area -->
<div class="px-margin-mobile pb-xl flex flex-col items-center gap-xl">
<!-- Page Indicator Dots -->
<div class="flex gap-2">
<div class="w-8 h-2 rounded-full bg-primary transition-all"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest transition-all"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest transition-all"></div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-full font-label-md text-body-lg shadow-[0_8px_24px_rgba(46,196,182,0.15)] transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
                    Get Started
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>

<p class="font-label-sm text-outline text-center px-lg">

                </p>
</div>
</div>

<div class="fixed top-[-10%] right-[-10%] w-[300px] h-[300px] bg-primary-container/10 rounded-full blur-3xl -z-10"></div>
