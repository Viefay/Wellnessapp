<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar: Suppressed standard top-level nav for task-focused screen, but maintaining brand identity for navigation -->
<header class="bg-surface/80 backdrop-blur-md shadow-sm sticky top-0 z-50 h-16 w-full flex justify-between items-center px-margin-mobile">
<div class="flex items-center gap-md">
<button class="transition-all duration-200 active:scale-95 hover:opacity-80 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Gait Analysis</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline-variant/30">
<img alt="User profile photo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQ4f0KWiv65lVfJgVKe3zakMCW4-7cr8gCCzRTvhtju1P5CKTNOs0dDoQxxZ5tlWX123e1dRQwGFbU-0y42bLgv3HAmwzB4tVbJh6kc2WR_S8VSljOOOmNnFc05oJbjGJNpYbDQ6HINurTwqyV0ya-BcqxakPwn57kzTirsYOwvQbjtrJ4gTzmxVr-L26h-xDEp1Y9AA37G4NQ3hOWaw3LREPJpHW6Gz_k13rJXHpToUUpbYJ_OO2NYlGLknK6uv96IOnBiMhlrz8"/>
</div>
</header>
<main class="min-h-[calc(100vh-64px)] px-margin-mobile pt-lg pb-xl max-w-lg mx-auto flex flex-col">
<!-- Header Section -->
<section class="mb-xl text-center">
<h2 class="font-display-lg text-display-lg text-on-surface mb-xs">Select Foot Side</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Choose which foot you want to record first.</p>
</section>
<!-- Selection Cards Grid -->
<div class="grid grid-cols-1 gap-lg mb-xl">
<!-- Left Foot Card (Inactive State) -->
<button class="group relative flex flex-col items-center p-lg bg-surface-container-lowest rounded-lg border-2 border-transparent shadow-[0_4px_20px_0_rgba(29,53,87,0.06)] transition-all duration-300 active:scale-[0.98] text-left hover:border-outline-variant">
<div class="w-full h-40 mb-md rounded-md bg-surface-container-low overflow-hidden">
<img alt="Left Foot illustration" class="w-full h-full object-contain p-md" data-alt="A minimalist vector-style illustration of a human figure in profile performing a steady walking gait, focusing on the left leg movement. The art style is clean and medical-grade with soft teal and mint accents against a bright white background. Lighting is high-key and professional, evoking a clinical yet warm wellness technology aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuATB0Bd_nyzRszKD-Yk6oUc7knHA3xlnyeRiNP4jS_sIBmnPTvfsAJGFkj_-4iyB7WEU8A7kQ4K5gnjWWxcfeCbZ25SplDocKAMZY7HFc6OTCeRqGK2a_pVwXVNxKQTM32oSFFxvvi9O-5mI14dX_OFvH8P9mAyoQXaxocTMcNkBH4albwyKI9T1nAzUYLBjxaoYPXzPuAwP1ocuC2YEdi_O2B7v1mo2-qh5X8MhWJobiq5du7gcNUwDd0ArylVbgwzV2G5kwK6C0U"/>
</div>
<div class="w-full">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Left Foot</h3>
<p class="font-label-md text-label-md text-on-surface-variant">Analyze balance and step pressure for the left side.</p>
</div>
<div class="absolute top-4 right-4 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-transparent"></div>
</div>
</button>
<!-- Right Foot Card (Active State) -->
<button class="group relative flex flex-col items-center p-lg bg-primary-container/10 rounded-lg border-2 border-primary shadow-[0_8px_24px_0_rgba(46,196,182,0.15)] transition-all duration-300 active:scale-[0.98] text-left">
<div class="w-full h-40 mb-md rounded-md bg-white/50 overflow-hidden">
<img alt="Right Foot illustration" class="w-full h-full object-contain p-md" data-alt="A clean, minimalist illustration of a professional gait analysis session, highlighting the right leg during mid-stride. The visual style follows a modern medical aesthetic with soft lighting and a palette of deep navy and bright teal. The background is pristine and clutter-free, emphasizing precise biological movement and health data accuracy." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAhVYcVvtQ97flt-wNeMOJurt1_OHtc5ZtSZH1T3W1OfhNJtmcGjBHA3-fZKE0-VTc2ksNdJDILXWpWHZQbAyvmEJopygbviBphwuAJjr-w9WmG3TqYWm6boh4Vck1bIXuvMAtXC1YBtRk4bjt1S-Tur1GU4Q-jcZUgDkRWu3M_fFwMnRYK1LvlMAzrkmqXRGA8E5TA-l3N42iWWLQ3sR4Yw_A55Cg3c8w4RWS_QwQlYZALibFHp_ZYCSBtJY6BtHBW_ALnjN9FYqw"/>
</div>
<div class="w-full">
<h3 class="font-headline-sm text-headline-sm text-primary mb-xs">Right Foot</h3>
<p class="font-label-md text-label-md text-on-primary-container/80">Analyze balance and step pressure for the right side.</p>
</div>
<div class="absolute top-4 right-4 w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center bg-primary">
<span class="material-symbols-outlined text-white text-[16px]" style="font-variation-settings: 'wght' 700">check</span>
</div>
</button>
</div>
<!-- Info Box -->
<div class="bg-surface-container-high rounded-md p-md mb-xl flex gap-md items-start">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1">info</span>
<p class="font-label-md text-label-md text-on-surface-variant">
        You will be asked to record the other foot after this session.
      </p>
</div>
<!-- Action Button -->
<div class="mt-auto">
<button class="w-full bg-primary text-on-primary font-headline-sm py-4 rounded-full shadow-lg transition-all duration-300 active:scale-95 hover:opacity-90 flex items-center justify-center gap-base">
        Continue to Recording
        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar: Suppressed because this is a focused task-flow sub-page -->
<!-- We use a spacer instead to prevent content from hitting the bottom safe area -->
<footer class="h-8 w-full bg-transparent"></footer>
</body></html>
