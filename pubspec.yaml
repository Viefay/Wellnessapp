name: wellness_app
description: Wellness App - Smart gait assessment from your smartphone.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.2.0
  google_fonts: ^8.1.0
  firebase_core: ^4.8.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  tflite_flutter: ^0.12.1
  sensors_plus: ^7.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.1.1
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
